<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | strip_html | escape }} | {{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">本文へ移動</a>
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <a class="home-link" href="{{ '/' | relative_url }}">記事一覧</a>
    </header>
    <main id="content" class="content markdown-body">
      {{ content }}
    </main>
    <footer class="site-footer">
      <a href="{{ '/' | relative_url }}">記事一覧へ戻る</a>
      <span>読んで、試して、考える。</span>
    </footer>
  </body>
</html>
