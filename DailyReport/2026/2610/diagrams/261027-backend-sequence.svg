<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc">
  <title id="title">バックエンドを設計対象にした本検索のシーケンス図</title>
  <desc id="desc">外部のWebフロントが著者名を指定して検索APIを呼ぶ。バックエンドではSearchController、SearchService、BookDAO、データベースの順に依頼が伝わる。検索された行から本の一覧が返り、最後にHTTPの200 OKと本の一覧のJSONがフロントへ返る。通信を待つ間のフロントの処理や非同期実装の詳細は省略している。</desc>
