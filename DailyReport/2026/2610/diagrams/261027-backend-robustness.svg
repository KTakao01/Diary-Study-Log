<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">バックエンドを設計対象にしたロバストネス図</title>
  <desc id="desc">Webフロントは設計対象の外にあるアクター。バックエンドの枠内には、バウンダリの検索API、コントロールの著者名で本を検索する処理、エンティティの本Bookがある。線は関わりを表し、実行順序を表すものではない。専用記号の代わりに役割名を示した簡略表記。</desc>
  <rect width="1000" height="360" fill="#ffffff" />
  <text x="34" y="49" font-family="sans-serif" fill="#1c2938" font-size="20" font-weight="600">外部</text>
  <rect x="255" y="22" width="710" height="279" rx="12" fill="#f1f7fc" stroke="#9bb2c9" stroke-width="1.5" />
  <text x="280" y="56" font-family="sans-serif" fill="#1c2938" font-size="20" font-weight="600">設計対象：バックエンド</text>
  <path d="M224 180 H285 M455 180 H500 M730 180 H775" stroke="#4b5b6b" stroke-width="2" fill="none" />
  <rect x="34" y="135" width="190" height="90" rx="8" fill="#f6f7f9" stroke="#718197" stroke-width="1.5" />
  <text x="129" y="163" text-anchor="middle" font-family="sans-serif" fill="#42546a" font-size="16">外部アクター</text>
  <text x="129" y="198" text-anchor="middle" font-family="sans-serif" fill="#1c2938" font-size="18">Webフロント</text>
  <rect x="285" y="135" width="170" height="90" rx="4" fill="#ffffff" stroke="#426b91" stroke-width="1.5" />
  <text x="370" y="163" text-anchor="middle" font-family="sans-serif" fill="#42546a" font-size="16">《boundary》</text>
  <text x="370" y="198" text-anchor="middle" font-family="sans-serif" fill="#1c2938" font-size="18">検索API</text>
  <rect x="500" y="126" width="230" height="108" rx="30" fill="#ffffff" stroke="#426b91" stroke-width="1.5" />
  <text x="615" y="154" text-anchor="middle" font-family="sans-serif" fill="#42546a" font-size="16">《control》</text>
  <text x="615" y="187" text-anchor="middle" font-family="sans-serif" fill="#1c2938" font-size="18">著者名で本を</text>
  <text x="615" y="213" text-anchor="middle" font-family="sans-serif" fill="#1c2938" font-size="18">検索する</text>
  <rect x="775" y="135" width="160" height="90" rx="4" fill="#ffffff" stroke="#426b91" stroke-width="1.5" />
  <text x="855" y="163" text-anchor="middle" font-family="sans-serif" fill="#42546a" font-size="16">《entity》</text>
  <text x="855" y="198" text-anchor="middle" font-family="sans-serif" fill="#1c2938" font-size="18">本（Book）</text>
  <text x="34" y="337" font-family="sans-serif" fill="#42546a" font-size="16">役割名による簡略表記。線は要素同士の関わりを示す（実行順序ではない）。</text>
</svg>
